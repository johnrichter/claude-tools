# SC-DISTRIBUTION release: claude-tools cross-compiles itself into per-OS/arch archives +
# checksums and publishes them as the tag's official GitHub release, through the fleet's
# shared release-cli.yml template.
#
# Triggers on a vX.Y.Z tag push, or a manual dispatch naming the same shape. The template's
# own tag-format check reads tag_module "." against this repo's own language-tools.yaml
# (path ".", tag_form bare) — a bare tag is exactly what both trigger paths here produce, so
# the pattern below is unchanged.

name: SC-DISTRIBUTION release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to cut, e.g. v1.2.3"
        required: true
        type: string

jobs:
  release-cli:
    uses: johnrichter/claude-shared-tooling/.github/workflows/release-cli.yml@v0.4.0
    with:
      version: ${{ inputs.version || github.ref_name }}
      module_dir: "."
      tag_module: "."
      language: go
      binaries: "claude-tools:."
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# CI for claude-tools: the fleet's generic OS/process/hardware, remote-fetch and state CLI.
#
# go.mod has no local replace directive: it resolves clikit, state, sysops and webfetch
# from claude-shared-tooling's public module proxy at their tagged versions, so every job
# that runs go build/vet/test only needs to check out this repo.
#
# build-test's first two steps enforce SC-VERSIONING on a tag push: they install the
# pinned language-tools release (CONTRACT-CI-LT-INSTALL) and run its own `tag validate`
# subcommand against ${GITHUB_REF_NAME}. SC-DISTRIBUTION's committed-binary check runs at
# commit time and at each git-tools governed write, not here (R7).

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag validate runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: claude-tools

      # Installs language-tools 2.1.0 from its own published GitHub release,
      # verifying the downloaded archive's sha256 against that release's own
      # checksums.txt and failing closed on a mismatch (CONTRACT-CI-LT-INSTALL).
      # Runs only on a tag push, the same condition as the tag-validate step it
      # feeds, so a pull-request run downloads nothing.
      - name: Install language-tools (pinned release)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LANGUAGE_TOOLS_VERSION: "2.1.0"
          LANGUAGE_TOOLS_REPO: johnrichter/language-tools
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/${LANGUAGE_TOOLS_REPO}/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          curl -fsSL -o "${archive}" "${base_url}/${archive}"
          curl -fsSL -o checksums.txt "${base_url}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" language-tools
          chmod +x "${HOME}/.local/bin/language-tools"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          rm -f "${archive}" checksums.txt

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: language-tools tag validate "${GITHUB_REF_NAME}" --module .

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: claude-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/claude-tools

      - name: go test
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: claude-tools

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: claude-tools/go.mod

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          working-directory: claude-tools

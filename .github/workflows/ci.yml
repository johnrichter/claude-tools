# CI for claude-tools: the fleet's generic OS/process/hardware, remote-fetch and state CLI.
#
# go.mod has no local replace directive: it resolves clikit, state, sysops and webfetch
# from claude-shared-tooling's public module proxy at their tagged versions, so the
# ci-go.yml template's own checkout of this repo is all any check needs.
#
# SC-VERSIONING's tag-format check now runs inside release.yml's own release-cli.yml call,
# not here: a CI run carries no tag, so this workflow validates nothing tag-shaped.
# SC-DISTRIBUTION's committed-binary check runs at commit time and at each git-tools
# governed write, not here (R7).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  ci-go:
    uses: johnrichter/claude-shared-tooling/.github/workflows/ci-go.yml@v0.4.0
    with:
      module_dir: "."
      test_timeout: 300
